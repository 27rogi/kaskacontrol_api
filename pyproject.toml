[project]
name = "kaskacontrol_ryzhenkov_ybvt2304"
description = "ВКР"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fpdf2>=2.8.7",
    "fastapi>=0.115.0",
    "matplotlib>=3.10.9",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "reportlab>=4.5.1",
    "rich>=15.0.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.64",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "av>=19.0.1",
    "sqlalchemy>=2.0,<2.1",
    "httpx2>=2.13.1",
    "lap>=0.5.13",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "__pycache__", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
